# YOLO11 with EMA attention only (standard 3-scale, for ablation study)
# P3/8, P4/16, P5/32 detection heads + EMA at each fusion level

nc: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 (P3/8 backbone feature)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6 (P4/16 backbone feature)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 (P5/32 backbone feature)

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11: up P5
  - [[-1, 6], 1, Concat, [1]] # 12: cat + P4 backbone
  - [-1, 2, C3k2, [512, False]] # 13: P4-up
  - [-1, 1, EMA, [32]] # 14: EMA P4-up

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15: up P4
  - [[-1, 4], 1, Concat, [1]] # 16: cat + P3 backbone
  - [-1, 2, C3k2, [256, False]] # 17: P3-up
  - [-1, 1, EMA, [32]] # 18: EMA P3-up

  - [-1, 1, Conv, [256, 3, 2]] # 19: P3->P4 down
  - [[-1, 13], 1, Concat, [1]] # 20: cat + P4-up (layer 13)
  - [-1, 2, C3k2, [512, False]] # 21: P4-down
  - [-1, 1, EMA, [32]] # 22: EMA P4-down

  - [-1, 1, Conv, [512, 3, 2]] # 23: P4->P5 down
  - [[-1, 10], 1, Concat, [1]] # 24: cat + P5 backbone
  - [-1, 2, C3k2, [1024, True]] # 25: P5-down

  - [[18, 22, 25], 1, Detect, [nc]] # 3-scale Detect
